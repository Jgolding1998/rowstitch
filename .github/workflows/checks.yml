name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        # Standard Intel Mac runners retain macOS coverage when the arm64 pool has no capacity.
        # This matrix validates x64 macOS; it does not claim an arm64 result.
        os: [ubuntu-latest, windows-latest, macos-26-intel]
        node: ['24.22.2', '26.13.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:types
      - name: Check local comparison fixtures
        run: node benchmarks/check.mjs
  browser:
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.2', '26.13.0']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  engine:
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.2', '26.13.0']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/integration/package-lock.json
            tests/comparison/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm --prefix tests/integration ci --ignore-scripts
      - run: npm --prefix tests/comparison ci --ignore-scripts
      - run: node --test tests/integration/protocol.test.mjs
      - name: Check the internal PostgreSQL and PGlite boundary
        env:
          ROWSTITCH_TEST_OUTPUT_DIR: ${{ runner.temp }}/rowstitch-engine-results
        run: node tests/integration/check.mjs ci
      - name: Check public native APIs and pinned comparisons
        env:
          ROWSTITCH_TEST_OUTPUT_DIR: ${{ runner.temp }}/rowstitch-public-results
        run: node tests/integration/public-driver.mjs ci --require-native --compare
